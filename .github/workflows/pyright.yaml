name: Pyright Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Pyright
        uses: jakebailey/pyright-action@v2
